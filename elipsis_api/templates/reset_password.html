{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="auth auth-pro">
  <section class="auth-card auth-card-pro" style="margin:auto;">
    <div class="auth-card-head">
      <h2>Choose a new password</h2>
      <p class="muted">You will be signed out everywhere else.</p>
    </div>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% if token %}
    <form method="post" action="/reset-password" class="stack">
      <input type="hidden" name="token" value="{{ token }}">
      <label>New password
        <input type="password" name="password" required minlength="8" autocomplete="new-password">
      </label>
      <label>Confirm password
        <input type="password" name="password2" required minlength="8" autocomplete="new-password">
      </label>
      <button class="btn big full" type="submit">Update password</button>
    </form>
    {% else %}
    <p class="muted"><a href="/forgot-password">Request a new link</a></p>
    {% endif %}
  </section>
</div>
{% endblock %}
