<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">Elipsis — operational intelligence for logistics leaders</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#0a1628"/><stop offset="1" stop-color="#132542"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#d97706" stop-opacity=".34"/><stop offset="1" stop-color="#d97706" stop-opacity="0"/></radialGradient>
    <radialGradient id="teal" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="630"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0v48" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1080" cy="80" r="420" fill="url(#glow)"/>
  <circle cx="80" cy="590" r="360" fill="url(#teal)"/>
  <g transform="translate(64 48)">
    <rect width="76" height="76" rx="19" fill="#0f1e35" stroke="#fbbf24" stroke-opacity=".45"/>
    <path d="M20 23h34" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M20 38h24" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M20 53h14" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="55" cy="53" r="5" fill="#2dd4bf"/>
    <text x="98" y="34" font-family="'Source Serif 4', Georgia, serif" font-size="38" font-weight="600" fill="#ffffff" letter-spacing="-1">Elipsis</text>
    <text x="99" y="57" font-family="Inter, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="3" fill="#d4c9b4">OPERATIONAL INTELLIGENCE</text>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="64" y="244" font-family="'Source Serif 4', Georgia, serif" font-size="66" font-weight="600" fill="#fffcf7" letter-spacing="-2">Find the money</text>
    <text x="64" y="322" font-family="'Source Serif 4', Georgia, serif" font-size="66" font-weight="600" fill="#fbbf24" letter-spacing="-2">hidden in operations.</text>
    <text x="66" y="382" font-size="21" fill="#cbd5e1">A scored readiness index, a checkable cost model,</text>
    <text x="66" y="414" font-size="21" fill="#cbd5e1">and a 90-day plan your team can actually execute.</text>
    <rect x="64" y="466" width="278" height="58" rx="29" fill="url(#gold)"/>
    <text x="203" y="502" text-anchor="middle" font-size="17" font-weight="800" fill="#1c1206">Start free assessment →</text>
    <text x="66" y="575" font-size="14" fill="#94a3b8">Built for logistics operators · Nairobi · Mombasa</text>
    <text x="66" y="600" font-size="14" fill="#64748b">No consultants. No black box. Assumptions printed.</text>
  </g>
  <g transform="translate(720 112)" filter="url(#shadow)">
    <rect width="416" height="406" rx="28" fill="#0f1e35" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="1" y="1" width="414" height="404" rx="27" fill="none" stroke="#fbbf24" stroke-opacity=".18"/>
    <text x="32" y="44" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4" fill="#94a3b8">LIVE READINESS</text>
    <circle cx="110" cy="150" r="64" fill="none" stroke="#1e3a5f" stroke-width="12"/>
    <circle cx="110" cy="150" r="64" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-dasharray="251 402" transform="rotate(-90 110 150)"/>
    <text x="110" y="160" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="48" font-weight="600" fill="#fffcf7">62.4</text>
    <text x="110" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94a3b8">/ 100</text>
    <text x="200" y="132" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#2dd4bf">EMERGING</text>
    <text x="200" y="160" font-family="Inter, Arial, sans-serif" font-size="15" fill="#cbd5e1">Annual savings</text>
    <text x="200" y="190" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="600" fill="#fffcf7">KES 4.2M</text>
    <text x="200" y="220" font-family="Inter, Arial, sans-serif" font-size="12" fill="#94a3b8">Payback 7.4 months</text>
    <g transform="translate(32 262)">
      <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">PILLAR SCORES</text>
      <rect x="0" y="18" width="352" height="8" rx="4" fill="#1e3a5f"/><rect x="0" y="18" width="286" height="8" rx="4" fill="url(#gold)"/>
      <rect x="0" y="44" width="352" height="8" rx="4" fill="#1e3a5f"/><rect x="0" y="44" width="232" height="8" rx="4" fill="#2dd4bf"/>
      <rect x="0" y="70" width="352" height="8" rx="4" fill="#1e3a5f"/><rect x="0" y="70" width="176" height="8" rx="4" fill="#fbbf24" opacity=".7"/>
      <rect x="0" y="96" width="352" height="8" rx="4" fill="#1e3a5f"/><rect x="0" y="96" width="310" height="8" rx="4" fill="#2dd4bf" opacity=".7"/>
    </g>
    <rect x="32" y="376" width="352" height="1" fill="#ffffff" fill-opacity=".08"/>
  </g>
</svg>
