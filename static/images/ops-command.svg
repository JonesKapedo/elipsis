<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Live dispatch control room</title>
  <desc id="desc">A dark operations map with dispatch routes, port nodes, warehouse lanes and live performance signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071611"/>
      <stop offset="0.55" stop-color="#0b241c"/>
      <stop offset="1" stop-color="#123a2d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.25" r="0.65">
      <stop offset="0" stop-color="#dda15e" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#dda15e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint" cx="0.2" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#9ecb9d" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9ecb9d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dda15e"/>
      <stop offset="1" stop-color="#f0c68a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#f5efe2" stroke-opacity="0.055"/>
    </pattern>
    <pattern id="micro" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f5efe2" fill-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="32" fill="url(#grid)"/>
  <rect width="1200" height="760" rx="32" fill="url(#glow)"/>
  <rect width="1200" height="760" rx="32" fill="url(#mint)"/>
  <g opacity="0.4" fill="none" stroke="#c6ddc7" stroke-width="1">
    <path d="M-60 620C150 550 250 640 430 560S760 420 980 500s260 120 340 70"/>
    <path d="M-80 680C130 610 265 700 450 620s330-120 560-40 230 120 330 78"/>
    <path d="M-40 560C165 490 280 580 470 500s335-120 555-35 230 110 330 64"/>
  </g>
  <text x="52" y="62" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" letter-spacing="3" fill="#dda15e">LIVE OPERATIONS ATLAS</text>
  <text x="52" y="122" font-family="Fraunces, Georgia, serif" font-size="53" font-weight="600" fill="#f7f1e5" letter-spacing="-1.5">The whole operation,</text>
  <text x="52" y="176" font-family="Fraunces, Georgia, serif" font-size="53" font-weight="600" fill="#c9ddc6" letter-spacing="-1.5">in one field of view.</text>
  <g transform="translate(52 224)" filter="url(#shadow)">
    <rect width="430" height="196" rx="18" fill="url(#panel)" stroke="#f5efe2" stroke-opacity="0.1"/>
    <text x="24" y="34" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" letter-spacing="2" fill="#aabbb0">FIRST CONSTRAINT</text>
    <text x="24" y="70" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="600" fill="#f7f1e5">Dispatch handoffs</text>
    <text x="24" y="98" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#aabbb0">Late release → rework → idle dock time</text>
    <rect x="24" y="120" width="382" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="24" y="120" width="246" height="8" rx="4" fill="url(#route)"/>
    <text x="24" y="156" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8fa397">READINESS</text>
    <text x="112" y="158" font-family="IBM Plex Mono, monospace" font-size="17" font-weight="600" fill="#f7f1e5">62</text>
    <text x="160" y="156" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8fa397">EXPOSURE</text>
    <text x="242" y="158" font-family="IBM Plex Mono, monospace" font-size="17" font-weight="600" fill="#dda15e">$184k</text>
    <text x="327" y="156" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8fa397">/ YEAR</text>
  </g>
  <g transform="translate(550 188)">
    <rect width="598" height="500" rx="22" fill="#06100d" fill-opacity="0.56" stroke="#f5efe2" stroke-opacity="0.12" filter="url(#shadow)"/>
    <rect width="598" height="500" rx="22" fill="url(#micro)"/>
    <g opacity="0.5" fill="none" stroke="#9ecb9d" stroke-width="1">
      <path d="M38 388C130 360 136 286 222 274s142 4 206-58 72-108 132-120"/>
      <path d="M38 430C148 398 172 334 250 324s146 10 206-52 76-106 132-120"/>
    </g>
    <path d="M58 390C146 356 162 292 244 280s134-4 194-62 70-100 124-112" fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round"/>
    <path d="M58 390C146 356 162 292 244 280s134-4 194-62 70-100 124-112" fill="none" stroke="#f7f1e5" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="5 9"/>
    <g fill="#dda15e">
      <circle cx="58" cy="390" r="7"/><circle cx="244" cy="280" r="7"/><circle cx="438" cy="218" r="7"/><circle cx="562" cy="106" r="9"/>
    </g>
    <g fill="#f7f1e5" fill-opacity="0.06" stroke="#f5efe2" stroke-opacity="0.14">
      <rect x="278" y="330" width="140" height="72" rx="10"/>
      <rect x="438" y="332" width="122" height="60" rx="10"/>
      <rect x="90" y="126" width="142" height="60" rx="10"/>
    </g>
    <g font-family="IBM Plex Mono, monospace" fill="#aabbb0">
      <text x="296" y="355" font-size="9" letter-spacing="1.5">PORT · CFS</text>
      <text x="296" y="380" font-size="15" fill="#f7f1e5">Mombasa</text>
      <text x="456" y="356" font-size="9" letter-spacing="1.5">DC · LAST MILE</text>
      <text x="456" y="380" font-size="15" fill="#f7f1e5">Nairobi</text>
      <text x="108" y="152" font-size="9" letter-spacing="1.5">CORRIDOR</text>
      <text x="108" y="174" font-size="15" fill="#f7f1e5">Northern route</text>
    </g>
    <g transform="translate(30 30)">
      <rect width="128" height="30" rx="15" fill="#dda15e" fill-opacity="0.13" stroke="#dda15e" stroke-opacity="0.34"/>
      <circle cx="18" cy="15" r="4" fill="#b9d88e"/>
      <text x="30" y="19" font-family="IBM Plex Mono, monospace" font-size="9" font-weight="600" letter-spacing="1.4" fill="#f0c68a">12 SIGNALS LIVE</text>
    </g>
    <g transform="translate(408 28)">
      <text x="0" y="0" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="1.5" fill="#8fa397">ON-TIME RELEASE</text>
      <text x="0" y="30" font-family="IBM Plex Mono, monospace" font-size="27" font-weight="600" fill="#f7f1e5">84%</text>
      <text x="84" y="30" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#b9d88e">↑ 6.4</text>
    </g>
    <g transform="translate(30 430)">
      <text x="0" y="0" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="1.5" fill="#8fa397">DISPATCH LOAD</text>
      <rect x="0" y="16" width="350" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="0" y="16" width="238" height="7" rx="3.5" fill="#dda15e"/>
      <text x="264" y="23" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#f0c68a">68%</text>
      <text x="390" y="0" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="1.5" fill="#8fa397">CASH CYCLE</text>
      <text x="390" y="28" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="600" fill="#f7f1e5">48d</text>
      <text x="466" y="28" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#e8b089">watch</text>
    </g>
  </g>
  <g transform="translate(52 472)" font-family="IBM Plex Mono, monospace">
    <rect width="184" height="58" rx="12" fill="#f7f1e5"/>
    <text x="20" y="24" font-size="9" letter-spacing="1.5" fill="#6e6a5f">OPERATING SCORE</text>
    <text x="20" y="48" font-size="22" font-weight="600" fill="#10231c">62 / 100</text>
    <rect x="200" width="184" height="58" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f5efe2" stroke-opacity="0.12"/>
    <text x="220" y="24" font-size="9" letter-spacing="1.5" fill="#8fa397">90-DAY ACTIONS</text>
    <text x="220" y="48" font-size="22" font-weight="600" fill="#f7f1e5">25</text>
    <rect x="400" width="184" height="58" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f5efe2" stroke-opacity="0.12"/>
    <text x="420" y="24" font-size="9" letter-spacing="1.5" fill="#8fa397">EVIDENCE</text>
    <text x="420" y="48" font-size="22" font-weight="600" fill="#b9d88e">82%</text>
  </g>
</svg>
