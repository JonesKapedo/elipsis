[project]
name = "elipsis"
version = "0.2.0"
description = "Elipsis — Business Transformation Intelligence"
requires-python = ">=3.11"

# The web platform (FastAPI) is the primary interface. The Telegram bot's
# dependencies are kept separate because it runs from its own virtualenv.
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.2",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
# Telegram bot — install with: pip install -e '.[bot]'
bot = [
    "aiogram==3.31.0",
    "aiohttp==3.14.3",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies.postgres]
postgres = ["psycopg[binary]==3.2.9"]

[project.optional-dependencies.dev]
dev = ["pytest==9.1.1", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools]
packages = ["elipsis_api", "elipsis_api.routers"]
py-modules = ["constants", "readiness", "elipsis_questions", "scoring"]
